name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verificar formatação e erros (ruff)
        run: ruff check .

      - name: Rodar testes de qualidade (pytest)
        run: pytest tests/ -v

- name: Configurar profile do dbt (CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          lumen:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: '${{ github.workspace }}/lumen_ci.duckdb'
                threads: 4
          EOF

      - name: Criar banco sintético para o dbt
        run: python tests/criar_banco_ci.py

      - name: dbt build (modelos + testes)
        working-directory: transform/dbt
        run: dbt build --target ci
