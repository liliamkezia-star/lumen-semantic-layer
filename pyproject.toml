[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (erros reais: variável não usada, import quebrado)
    "I",    # isort (ordenação de imports)
    "UP",   # pyupgrade (sintaxe moderna do Python)
    "B",    # flake8-bugbear (bugs prováveis)
    "DTZ",  # flake8-datetimez (datetime sem timezone)
    "N",    # pep8-naming (snake_case em funções, UPPER_CASE em constantes)
]

ignore = [
    # Mensagens de erro detalhadas são intencionais neste projeto:
    # ajudam a diagnosticar problemas de schema/API sem abrir o código.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Blocos SQL longos em strings: quebrar as linhas prejudicaria a leitura.
"tests/criar_banco_ci.py" = ["E501"]
"tests/reconciliar_totais.py" = ["E501"]
# Notebooks do Fabric: `spark` e `notebookutils` são injetados pelo runtime
# do Fabric/Synapse em tempo de execução, não importados no código — o
# ruff não tem como saber disso rodando fora do Fabric.
"fabric/notebooks/*" = ["F821"]
