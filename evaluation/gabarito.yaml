    certificada: {medidas: [Taxa de Inadimplência (SCR.data)], filtros: {ano: 2025}, agrupar_por: trimestre}

  # ---------------------------------------------------------------- E
  # Macro e deflacionamento (pegadinha). Inflação acumulada é o PRODUTO de
  # (1 + variação mensal), não a soma. Séries SGS mensais têm data no
  # primeiro dia do mês; a Selic meta é diária, e a medida é a média do mês.

  - id: E01
    categoria: E
    pergunta: Qual foi a inflação (IPCA) acumulada em 2025?
    tipo: valor
    unidade: fracao
    sql: |
      SELECT EXP(SUM(LOG(1 + valor / 100.0))) - 1 AS valor FROM gold.fato_indicador_macro
      WHERE nome_serie = 'ipca_mensal' AND id_data BETWEEN 20250101 AND 20251201
    certificada: {medidas: [IPCA 12 Meses (SGS)], filtros: {competencia: "2025-12"}}

  - id: E02
    categoria: E
    pergunta: Segundo o SCR.data e descontada a inflação, quanto a carteira de crédito ativa cresceu entre dezembro de 2024 e dezembro de 2025?
    tipo: valor
    unidade: fracao
    sql: |
      SELECT (SELECT SUM(carteira_ativa) FROM gold.fato_credito WHERE id_data = 20251231)
           / (SELECT SUM(carteira_ativa) FROM gold.fato_credito WHERE id_data = 20241231)
           / (SELECT EXP(SUM(LOG(1 + valor / 100.0))) FROM gold.fato_indicador_macro
              WHERE nome_serie = 'ipca_mensal' AND id_data BETWEEN 20250101 AND 20251201) - 1 AS valor
    certificada: {medidas: [Carteira Ativa Δ% a/a Real], filtros: {competencia: "2025-12"}}

  - id: E03
    categoria: E
    pergunta: Segundo o SCR.data, quanto valeria a carteira de crédito ativa de dezembro de 2020 em reais de dezembro de 2025?
    tipo: valor
    unidade: reais
    sql: |
      SELECT (SELECT SUM(carteira_ativa) FROM gold.fato_credito WHERE id_data = 20201231)
           * (SELECT EXP(SUM(LOG(1 + valor / 100.0))) FROM gold.fato_indicador_macro
              WHERE nome_serie = 'ipca_mensal' AND id_data BETWEEN 20210101 AND 20251201) AS valor
    certificada: {medidas: [Carteira Ativa Real (R$ da Última Competência)], filtros: {competencia: "2020-12"}}

