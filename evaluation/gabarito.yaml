    tipo: valor
    unidade: fracao
    sql: |
      SELECT (SELECT SUM(carteira_ativa) FROM gold.fato_credito WHERE id_data = 20251231)
           / (SELECT SUM(carteira_ativa) FROM gold.fato_credito WHERE id_data = 20241231) - 1 AS valor
    certificada: {medidas: [Carteira Ativa Δ% a/a], filtros: {competencia: "2025-12"}}

