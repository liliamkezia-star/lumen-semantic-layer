  # ---------------------------------------------------------------- D
  # Semiaditividade (pegadinha): carteira é ESTOQUE. "A carteira de 2024" é
  # a posição de dezembro de 2024 — somar os 12 meses dá um número 12 vezes
  # maior e sem sentido. Variação de taxa é em pontos percentuais, não em %.

  - id: D01
    categoria: D
    pergunta: Segundo o SCR.data, qual foi a carteira de crédito ativa em 2024?
    tipo: valor
    unidade: reais
    sql: SELECT SUM(carteira_ativa) AS valor FROM gold.fato_credito WHERE id_data = 20241231
    certificada: {medidas: [Carteira Ativa], filtros: {ano: 2024}}

  - id: D02
    categoria: D
