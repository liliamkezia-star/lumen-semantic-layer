# Gabarito do benchmark (Sprint 11 do plano). Metodologia em METODOLOGIA.md.
#
# Cada pergunta tem duas verificações independentes:
#   sql:          escrito à mão sobre a Gold (SQL endpoint), sem passar pelo DAX.
#                 Devolve a coluna `valor` (e `nome` em ranking, `rotulo` em
#                 respostas com vários valores).
#   certificada:  a consulta equivalente na camada semântica
#                 (argumentos de agent.consultas.consultar).
# A resposta só entra no gabarito congelado se as duas baterem.
#
# Competências sempre explícitas nas perguntas: o gabarito é congelado e
# não pode "andar" quando a Gold ganhar um mês novo.
#
# tipo:     valor | valores | ranking | recusa
# unidade:  a mesma de agent.catalogo.UNIDADES (define como o número é lido)

perguntas:

  # ---------------------------------------------------------------- A
  # Consulta direta: uma métrica, uma competência.

  - id: A01
    categoria: A
    pergunta: Segundo o SCR.data, qual era a carteira de crédito ativa em dezembro de 2025?
    tipo: valor
    unidade: reais
    sql: SELECT SUM(carteira_ativa) AS valor FROM gold.fato_credito WHERE id_data = 20251231
    certificada: {medidas: [Carteira Ativa], filtros: {competencia: "2025-12"}}

  - id: A02
    categoria: A
    pergunta: Segundo o SCR.data, qual era a taxa de inadimplência do crédito em dezembro de 2025?
    tipo: valor
    unidade: fracao
    sql: |
      SELECT SUM(carteira_inadimplencia) / SUM(carteira_ativa) AS valor
      FROM gold.fato_credito WHERE id_data = 20251231
    certificada: {medidas: [Taxa de Inadimplência (SCR.data)], filtros: {competencia: "2025-12"}}

